<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745"
     viewBox="0 0 1200 745" role="img"
     aria-labelledby="title description">
  <title id="title">Quadratic-map degeneration poset over F₁₆</title>
  <desc id="description">7 affine-equivalence classes. Arrows point downward
  from a quadratic map to a class obtainable using possibly singular affine
  input and output processors. Every node displays its equivalence-class size.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .74; }
      .node text { fill: #172033; text-anchor: middle;
                    font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 24px; font-weight: 700; }
      .kind { font-size: 16px; fill: #475569; }
      .size { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>

  <path class="edge" d="M 132 151 C 132 227.5, 132 227.5, 132 304" marker-end="url(#arrow)"/><path class="edge" d="M 180 151 C 180 227.5, 552 227.5, 552 304" marker-end="url(#arrow)"/><path class="edge" d="M 228 151 C 228 227.5, 972 227.5, 972 304" marker-end="url(#arrow)"/><path class="edge" d="M 552 151 C 552 227.5, 228 227.5, 228 304" marker-end="url(#arrow)"/><path class="edge" d="M 600 151 C 600 227.5, 600 227.5, 600 304" marker-end="url(#arrow)"/><path class="edge" d="M 648 151 C 648 227.5, 1020 227.5, 1020 304" marker-end="url(#arrow)"/><path class="edge" d="M 972 151 C 972 227.5, 648 227.5, 648 304" marker-end="url(#arrow)"/><path class="edge" d="M 1068 151 C 1068 227.5, 1068 227.5, 1068 304" marker-end="url(#arrow)"/><path class="edge" d="M 180 426 C 180 490, 552 490, 552 554" marker-end="url(#arrow)"/><path class="edge" d="M 600 426 C 600 490, 600 490, 600 554" marker-end="url(#arrow)"/><path class="edge" d="M 1020 426 C 1020 490, 648 490, 648 554" marker-end="url(#arrow)"/>
  <g class="node parabolic" transform="translate(180 95)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² + y</text><text class="kind" x="0" y="8">parabolic</text><text class="size" x="0" y="37">|class| = 979,200</text></g><g class="node split" transform="translate(600 95)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/><text class="form" x="0" y="-20">xy</text><text class="kind" x="0" y="8">split quadratic</text><text class="size" x="0" y="37">|class| = 8,355,840</text></g><g class="node anisotropic" transform="translate(1020 95)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#be123c" fill-opacity="0.10" stroke="#be123c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² + xy + δy²</text><text class="kind" x="0" y="8">anisotropic · Tr(δ)=1</text><text class="size" x="0" y="37">|class| = 7,372,800</text></g><g class="node linear" transform="translate(180 370)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/><text class="form" x="0" y="-20">x</text><text class="kind" x="0" y="8">linear</text><text class="size" x="0" y="37">|class| = 4,080</text></g><g class="node rank1" transform="translate(600 370)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/><text class="form" x="0" y="-20">x²</text><text class="kind" x="0" y="8">pure square</text><text class="size" x="0" y="37">|class| = 4,080</text></g><g class="node separable" transform="translate(1020 370)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-width="2.5"/><text class="form" x="0" y="-20">x² + x</text><text class="kind" x="0" y="8">square + aligned linear</text><text class="size" x="0" y="37">|class| = 61,200</text></g><g class="node constant" transform="translate(600 620)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/><text class="form" x="0" y="-20">constant</text><text class="kind" x="0" y="8">constant</text><text class="size" x="0" y="37">|class| = 16</text></g>
</svg>
