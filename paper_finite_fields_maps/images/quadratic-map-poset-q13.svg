<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745"
     viewBox="0 0 1200 745" role="img"
     aria-labelledby="title description">
  <title id="title">Quadratic-map degeneration poset over F₁₃</title>
  <desc id="description">6 affine-equivalence classes. Arrows point downward
  from a quadratic map to a class obtainable using possibly singular affine
  input and output processors. Every node displays its equivalence-class size.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .74; }
      .node text { fill: #172033; text-anchor: middle;
                    font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 24px; font-weight: 700; }
      .kind { font-size: 16px; fill: #475569; }
      .size { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>

  <path class="edge" d="M 142 161 C 142 232.5, 337 232.5, 337 304" marker-end="url(#arrow)"/><path class="edge" d="M 238 161 C 238 232.5, 767 232.5, 767 304" marker-end="url(#arrow)"/><path class="edge" d="M 552 161 C 552 232.5, 433 232.5, 433 304" marker-end="url(#arrow)"/><path class="edge" d="M 648 161 C 648 232.5, 815 232.5, 815 304" marker-end="url(#arrow)"/><path class="edge" d="M 1010 161 C 1010 232.5, 863 232.5, 863 304" marker-end="url(#arrow)"/><path class="edge" d="M 385 426 C 385 482.5, 552 482.5, 552 539" marker-end="url(#arrow)"/><path class="edge" d="M 815 426 C 815 482.5, 648 482.5, 648 539" marker-end="url(#arrow)"/>
  <g class="node parabolic" transform="translate(190 105)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² + y</text><text class="kind" x="0" y="8">parabolic</text><text class="size" x="0" y="37">|class| = 340,704</text></g><g class="node split" transform="translate(600 105)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/><text class="form" x="0" y="-20">xy</text><text class="kind" x="0" y="8">split quadratic</text><text class="size" x="0" y="37">|class| = 2,399,124</text></g><g class="node anisotropic" transform="translate(1010 105)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#be123c" fill-opacity="0.10" stroke="#be123c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² − νy²</text><text class="kind" x="0" y="8">anisotropic</text><text class="size" x="0" y="37">|class| = 2,056,392</text></g><g class="node linear" transform="translate(385 370)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/><text class="form" x="0" y="-20">x</text><text class="kind" x="0" y="8">linear</text><text class="size" x="0" y="37">|class| = 2,184</text></g><g class="node rank1" transform="translate(815 370)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/><text class="form" x="0" y="-20">x²</text><text class="kind" x="0" y="8">rank-1 quadratic</text><text class="size" x="0" y="37">|class| = 28,392</text></g><g class="node constant" transform="translate(600 605)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/><text class="form" x="0" y="-20">constant</text><text class="kind" x="0" y="8">constant</text><text class="size" x="0" y="37">|class| = 13</text></g>
</svg>
