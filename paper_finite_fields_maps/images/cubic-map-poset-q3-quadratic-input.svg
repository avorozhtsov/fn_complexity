<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745"
     viewBox="0 0 1200 745" role="img"
     aria-labelledby="title description">
  <title id="title">Cubic maps F₃² → F₃ · quadratic input processors</title>
  <desc id="description">Three mutual-reachability classes in the transitive closure of quadratic-input reductions. The classes form a chain.</desc>
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-linear" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .58; }
      .linear-edge { stroke: #0f766e; }
      .node text { fill: #172033; text-anchor: middle;
                    font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 21px; font-weight: 700; }
      .kind { font-size: 13px; fill: #475569; }
      .size { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>

  <path class="edge" d="M 600 163 C 600 240.76, 600 240.76, 600 307" marker-end="url(#arrow-default)"/><path class="edge" d="M 600 433 C 600 499.96, 600 499.96, 600 557" marker-end="url(#arrow-default)"/>
  <g class="node surjective" transform="translate(600 105)"><rect x="-195" y="-58" width="390" height="116" rx="17" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="2.5"/><text class="form" x="0" y="-22">x</text><text class="kind" x="0" y="3">all surjective cubic functions · image size 3</text><text class="size" x="0" y="33">|class| = 6,054</text></g><g class="node two-valued" transform="translate(600 375)"><rect x="-195" y="-58" width="390" height="116" rx="17" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/><text class="form" x="0" y="-22">x²</text><text class="kind" x="0" y="3">all two-valued cubic functions · fibers 6+3</text><text class="size" x="0" y="33">|class| = 504</text></g><g class="node constant" transform="translate(600 625)"><rect x="-195" y="-58" width="390" height="116" rx="17" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/><text class="form" x="0" y="-22">0</text><text class="kind" x="0" y="3">constant functions · image size 1</text><text class="size" x="0" y="33">|class| = 3</text></g>
</svg>
