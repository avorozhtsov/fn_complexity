<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1010"
     viewBox="0 0 1420 1010" role="img"
     aria-labelledby="title description">
  <title id="title">Degeneration order and exchange comparison over F₂₅</title>
  <desc id="description">The degeneration poset of quadratic maps over F₂₅ has
  three pairwise incomparable maximal classes. The asymptotic exchange rate merges
  the linear and parabolic classes, which share a fiber signature, and totally
  orders the four remaining signatures.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-exchange" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .74; }
      .carry { fill: none; stroke-width: 1.6; stroke-dasharray: 3 5; opacity: .55; }
      .exchange { fill: none; stroke: #b45309; stroke-width: 2.6; }
      .divider { stroke: #e2e8f0; stroke-width: 2; }
      .node text { fill: #172033; text-anchor: middle;
                    font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 23px; font-weight: 700; }
      .kind { font-size: 15px; fill: #475569; }
      .sig { font-size: 14px; fill: #475569;
              font-family: "SF Mono", ui-monospace, Menlo, monospace; }
      .badge { fill: #ffffff; font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif;
                text-anchor: middle; }
      .rank { font-size: 26px; font-weight: 700; text-anchor: middle; }
      .ladder-kind { font-size: 15px; fill: #475569; }
      .rate { fill: #b45309; font: 13px "SF Mono", ui-monospace, Menlo, monospace; }
      .verdict { fill: #b45309; font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .panel { fill: #172033; font: 650 19px Inter, ui-sans-serif, system-ui, sans-serif; }
      .panel-note { fill: #64748b; font: 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 14px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1420" height="1010" fill="#ffffff"/>
  <text class="title" x="710" y="62" text-anchor="middle">
    What the exchange rate decides that degeneration does not
  </text>
  <text class="subtitle" x="710" y="94" text-anchor="middle">
    quadratic maps F₂₅² → F₂₅ · fiber signatures are point counts, so every rate below is a ratio of logarithms of Weil numbers
  </text>
  <line class="divider" x1="900" y1="180" x2="900" y2="890"/>
  <text class="panel" x="450" y="212" text-anchor="middle">classical degeneration order</text>
  <text class="panel" x="1155" y="212" text-anchor="middle">exchange comparison</text>
  <text class="panel-note" x="450" y="240" text-anchor="middle">6 classes, three of them maximal and pairwise incomparable</text>
  <text class="panel-note" x="1155" y="240" text-anchor="middle">a strict total order on the fiber signatures</text>
  <path class="edge" d="M 170 388 C 170 455, 310 455, 310 522" marker-end="url(#arrow)"/>
  <path class="edge" d="M 170 388 C 170 455, 590 455, 590 522" marker-end="url(#arrow)"/>
  <path class="edge" d="M 450 388 C 450 455, 310 455, 310 522" marker-end="url(#arrow)"/>
  <path class="edge" d="M 450 388 C 450 455, 590 455, 590 522" marker-end="url(#arrow)"/>
  <path class="edge" d="M 730 388 C 730 455, 590 455, 590 522" marker-end="url(#arrow)"/>
  <path class="edge" d="M 310 648 C 310 705, 450 705, 450 762" marker-end="url(#arrow)"/>
  <path class="edge" d="M 590 648 C 590 705, 450 705, 450 762" marker-end="url(#arrow)"/>
  <path class="exchange" d="M 1155 442 L 1155 378" marker-end="url(#arrow-exchange)"/>
  <text class="rate" x="1177" y="404">C(A→X) = 0.8372</text>
  <text class="rate" x="1177" y="424">C(X→A) = 0.9993</text>
  <text class="verdict" x="1129" y="415" text-anchor="end">A ≺ X</text>
  <path class="exchange" d="M 1155 612 L 1155 548" marker-end="url(#arrow-exchange)"/>
  <text class="rate" x="1177" y="574">C(L→A) = 0.9880</text>
  <text class="rate" x="1177" y="594">C(A→L) = 0.9968</text>
  <text class="verdict" x="1129" y="585" text-anchor="end">L ≺ A</text>
  <path class="exchange" d="M 1155 782 L 1155 718" marker-end="url(#arrow-exchange)"/>
  <text class="rate" x="1177" y="744">C(S→L) = 0.7968</text>
  <text class="rate" x="1177" y="764">C(L→S) = 0.8228</text>
  <text class="verdict" x="1129" y="755" text-anchor="end">S ≺ L</text>
  <g class="node" transform="translate(170 330)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/><text class="form" x="0" y="-22">x² + y</text><text class="kind" x="0" y="4">parabolic</text><text class="sig" x="0" y="40">{25^25}</text><circle cx="96" cy="-32" r="17" fill="#0f766e" fill-opacity="0.9"/><text class="badge" x="96" y="-26">L</text></g>
  <g class="node" transform="translate(450 330)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/><text class="form" x="0" y="-22">xy</text><text class="kind" x="0" y="4">split quadratic</text><text class="sig" x="0" y="40">{49, 24^24}</text><circle cx="96" cy="-32" r="17" fill="#7c3aed" fill-opacity="0.9"/><text class="badge" x="96" y="-26">X</text></g>
  <g class="node" transform="translate(730 330)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#be123c" fill-opacity="0.10" stroke="#be123c" stroke-width="2.5"/><text class="form" x="0" y="-22">x² − νy²</text><text class="kind" x="0" y="4">anisotropic</text><text class="sig" x="0" y="40">{26^24, 1}</text><circle cx="96" cy="-32" r="17" fill="#be123c" fill-opacity="0.9"/><text class="badge" x="96" y="-26">A</text></g>
  <g class="node" transform="translate(310 590)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/><text class="form" x="0" y="-22">x</text><text class="kind" x="0" y="4">linear</text><text class="sig" x="0" y="40">{25^25}</text><circle cx="96" cy="-32" r="17" fill="#0f766e" fill-opacity="0.9"/><text class="badge" x="96" y="-26">L</text></g>
  <g class="node" transform="translate(590 590)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/><text class="form" x="0" y="-22">x²</text><text class="kind" x="0" y="4">rank-1 quadratic</text><text class="sig" x="0" y="40">{50^12, 25}</text><circle cx="96" cy="-32" r="17" fill="#2563eb" fill-opacity="0.9"/><text class="badge" x="96" y="-26">S</text></g>
  <g class="node" transform="translate(450 830)"><rect x="-122" y="-58" width="244" height="116" rx="18" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/><text class="form" x="0" y="-22">constant</text><text class="kind" x="0" y="4">constant</text><text class="sig" x="0" y="40">degenerate resource</text></g>
  <g class="node" transform="translate(1155 320)"><rect x="-150" y="-48" width="300" height="96" rx="16" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2.5"/><text class="rank" x="-124" y="6" fill="#7c3aed">X</text><text class="ladder-kind" x="18" y="-14">split</text><text class="sig" x="18" y="14">{49, 24^24}</text></g>
  <g class="node" transform="translate(1155 490)"><rect x="-150" y="-48" width="300" height="96" rx="16" fill="#be123c" fill-opacity="0.12" stroke="#be123c" stroke-width="2.5"/><text class="rank" x="-124" y="6" fill="#be123c">A</text><text class="ladder-kind" x="18" y="-14">anisotropic</text><text class="sig" x="18" y="14">{26^24, 1}</text></g>
  <g class="node" transform="translate(1155 660)"><rect x="-150" y="-48" width="300" height="96" rx="16" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="2.5"/><text class="rank" x="-124" y="6" fill="#0f766e">L</text><text class="ladder-kind" x="18" y="-14">linear · parabolic</text><text class="sig" x="18" y="14">{25^25}</text></g>
  <g class="node" transform="translate(1155 830)"><rect x="-150" y="-48" width="300" height="96" rx="16" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2.5"/><text class="rank" x="-124" y="6" fill="#2563eb">S</text><text class="ladder-kind" x="18" y="-14">pure square x²</text><text class="sig" x="18" y="14">{50^12, 25}</text></g>
  <line class="edge" x1="60" y1="959" x2="104" y2="959" marker-end="url(#arrow)"/><text class="legend" x="116" y="964">degeneration cover (classical)</text><circle cx="392" cy="959" r="14" fill="#0f766e" fill-opacity="0.9"/><text class="badge" x="392" y="964">L</text><text class="legend" x="416" y="964">fiber signature of the class · two cards carry L</text><line class="exchange" x1="836" y1="959" x2="880" y2="959" marker-end="url(#arrow-exchange)"/><text class="legend" x="892" y="964">strictly the better resource, decided by the rate and not by the poset</text>
</svg>
