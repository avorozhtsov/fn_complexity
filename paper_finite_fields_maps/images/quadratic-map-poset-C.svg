<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"
     viewBox="0 130 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Quadratic-map degeneration poset over the complex numbers</title>
  <desc id="description">Five affine-equivalence classes of quadratic maps from
  C squared to C. Arrows point downward along singular-processor degenerations.
  Nodes show continuum cardinality and complex orbit dimension.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .74; }
      .node text { fill: #172033; text-anchor: middle;
                   font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 24px; font-weight: 700; }
      .kind { font-size: 16px; fill: #475569; }
      .size { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .dimension { font-size: 15px; fill: #475569; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="950" fill="#ffffff"/>
  <path class="edge" d="M 330 316 C 330 390, 335 390, 335 464"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 410 316 C 410 390, 795 390, 795 464"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 790 316 C 790 390, 405 390, 405 464"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 870 316 C 870 390, 865 390, 865 464"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 370 606 C 370 670, 560 670, 560 729"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 830 606 C 830 670, 640 670, 640 729"
        marker-end="url(#arrow)"/>

  <g class="node parabolic" transform="translate(370 250)">
    <rect x="-128" y="-66" width="256" height="132" rx="18"
          fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/>
    <text class="form" x="0" y="-30">x² + y</text>
    <text class="kind" x="0" y="-2">parabolic</text>
    <text class="size" x="0" y="26">|class| = 𝔠</text>
    <text class="dimension" x="0" y="49">complex orbit dimension = 5</text>
  </g>
  <g class="node nondegenerate" transform="translate(830 250)">
    <rect x="-128" y="-66" width="256" height="132" rx="18"
          fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/>
    <text class="form" x="0" y="-30">xy</text>
    <text class="kind" x="0" y="-2">nondegenerate</text>
    <text class="size" x="0" y="26">|class| = 𝔠</text>
    <text class="dimension" x="0" y="49">complex orbit dimension = 6</text>
  </g>
  <g class="node linear" transform="translate(370 540)">
    <rect x="-128" y="-66" width="256" height="132" rx="18"
          fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/>
    <text class="form" x="0" y="-30">x</text>
    <text class="kind" x="0" y="-2">linear</text>
    <text class="size" x="0" y="26">|class| = 𝔠</text>
    <text class="dimension" x="0" y="49">complex orbit dimension = 3</text>
  </g>
  <g class="node rank1" transform="translate(830 540)">
    <rect x="-128" y="-66" width="256" height="132" rx="18"
          fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/>
    <text class="form" x="0" y="-30">x²</text>
    <text class="kind" x="0" y="-2">rank-1 quadratic</text>
    <text class="size" x="0" y="26">|class| = 𝔠</text>
    <text class="dimension" x="0" y="49">complex orbit dimension = 4</text>
  </g>
  <g class="node constant" transform="translate(600 805)">
    <rect x="-128" y="-66" width="256" height="132" rx="18"
          fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/>
    <text class="form" x="0" y="-30">constant</text>
    <text class="kind" x="0" y="-2">constant</text>
    <text class="size" x="0" y="26">|class| = 𝔠</text>
    <text class="dimension" x="0" y="49">complex orbit dimension = 1</text>
  </g>
</svg>
