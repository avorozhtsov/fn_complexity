<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200"
     viewBox="0 0 1900 1200" role="img" aria-labelledby="title description">
  <title id="title">Quadratic-map degeneration poset over the 2-adic numbers</title>
  <desc id="description">Twelve affine-equivalence classes of quadratic maps
  from Q_2 squared to Q_2. There is one split and seven anisotropic
  nondegenerate binary quadratic classes. Thirteen Hasse covers point downward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.3; opacity: .72; }
      .node text { fill: #172033; text-anchor: middle;
                   font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 23px; font-weight: 700; }
      .kind { font-size: 15px; fill: #475569; }
      .size { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .small-form { font-size: 19px; font-weight: 700; }
      .small-kind { font-size: 13px; fill: #6b2942; }
      .small-size { font-size: 12px; font-weight: 650; }
      .title { fill: #172033; font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 18px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #9f1239; font: 650 16px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1900" height="1200" fill="#ffffff"/>
  <text class="title" x="950" y="48" text-anchor="middle">
    Quadratic maps ℚ₂² → ℚ₂
  </text>
  <text class="subtitle" x="950" y="80" text-anchor="middle">
    affine-equivalence classes and singular-processor degenerations
  </text>
  <text class="legend" x="950" y="112" text-anchor="middle">
    square classes d ∈ {±1, ±2, ±5, ±10} · split d = −1 · 𝔠 = continuum
  </text>

  <rect x="760" y="145" width="1080" height="390" rx="24"
        fill="#be123c" fill-opacity="0.025" stroke="#be123c"
        stroke-opacity="0.45" stroke-width="2" stroke-dasharray="9 8"/>
  <text class="group-label" x="1300" y="175" text-anchor="middle">
    seven pairwise-incomparable anisotropic classes
  </text>

  <!-- Hasse covers: parabolic and split each reach linear and rank 1. -->
  <path class="edge" d="M 170 338 C 170 530, 450 530, 450 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 230 338 C 230 560, 1288 560, 1288 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 510 338 C 510 530, 550 530, 550 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 338 C 570 545, 1316 545, 1316 704"
        marker-end="url(#arrow)"/>

  <!-- Every anisotropic class reaches rank 1, but not linear. -->
  <path class="edge" d="M 900 312 L 900 340 L 790 340 L 790 570
                              C 790 635, 1344 635, 1344 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1160 312 L 1160 340 L 1190 340 L 1190 585
                              C 1190 640, 1372 640, 1372 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1420 312 L 1420 340 L 1510 340 L 1510 585
                              C 1510 640, 1400 640, 1400 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1680 312 L 1680 340 L 1810 340 L 1810 570
                              C 1810 635, 1428 635, 1428 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1030 472 C 1030 610, 1456 610, 1456 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1350 472 C 1350 600, 1484 600, 1484 704"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1670 472 C 1670 600, 1512 600, 1512 704"
        marker-end="url(#arrow)"/>

  <!-- The two lower nonconstant classes reach constants. -->
  <path class="edge" d="M 500 838 C 500 925, 900 925, 900 1004"
        marker-end="url(#arrow)"/>
  <path class="edge" d="M 1400 838 C 1400 925, 1000 925, 1000 1004"
        marker-end="url(#arrow)"/>

  <g class="node parabolic" transform="translate(200 280)">
    <rect x="-125" y="-58" width="250" height="116" rx="18"
          fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/>
    <text class="form" x="0" y="-24">x² + y</text>
    <text class="kind" x="0" y="4">parabolic</text>
    <text class="size" x="0" y="34">|class| = 𝔠 · dim = 5</text>
  </g>
  <g class="node split" transform="translate(540 280)">
    <rect x="-125" y="-58" width="250" height="116" rx="18"
          fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/>
    <text class="form" x="0" y="-24">x² − y²</text>
    <text class="kind" x="0" y="4">split · d = −1</text>
    <text class="size" x="0" y="34">|class| = 𝔠 · dim = 6</text>
  </g>

  <g class="node anisotropic-d1" transform="translate(900 260)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² + y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = 1</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-d2" transform="translate(1160 260)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² + 2y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = 2</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-dm2" transform="translate(1420 260)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² − 2y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = −2</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-d5" transform="translate(1680 260)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² + 5y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = 5</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-dm5" transform="translate(1030 420)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² − 5y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = −5</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-d10" transform="translate(1350 420)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² + 10y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = 10</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>
  <g class="node anisotropic-dm10" transform="translate(1670 420)">
    <rect x="-110" y="-52" width="220" height="104" rx="16"
          fill="#be123c" fill-opacity="0.09" stroke="#be123c" stroke-width="2"/>
    <text class="small-form" x="0" y="-20">x² − 10y²</text>
    <text class="small-kind" x="0" y="5">anisotropic · d = −10</text>
    <text class="small-size" x="0" y="31">|class| = 𝔠 · dim = 6</text>
  </g>

  <g class="node linear" transform="translate(500 780)">
    <rect x="-140" y="-58" width="280" height="116" rx="18"
          fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/>
    <text class="form" x="0" y="-24">x</text>
    <text class="kind" x="0" y="4">linear</text>
    <text class="size" x="0" y="34">|class| = 𝔠 · dim = 3</text>
  </g>
  <g class="node rank1" transform="translate(1400 780)">
    <rect x="-140" y="-58" width="280" height="116" rx="18"
          fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/>
    <text class="form" x="0" y="-24">x²</text>
    <text class="kind" x="0" y="4">rank-1 quadratic</text>
    <text class="size" x="0" y="34">|class| = 𝔠 · dim = 4</text>
  </g>
  <g class="node constant" transform="translate(950 1080)">
    <rect x="-140" y="-58" width="280" height="116" rx="18"
          fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/>
    <text class="form" x="0" y="-24">constant</text>
    <text class="kind" x="0" y="4">constant</text>
    <text class="size" x="0" y="34">|class| = 𝔠 · dim = 1</text>
  </g>
</svg>
