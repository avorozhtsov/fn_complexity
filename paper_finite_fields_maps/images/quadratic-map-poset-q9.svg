<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875"
     viewBox="0 0 1200 875" role="img"
     aria-labelledby="title description">
  <title id="title">Quadratic-map degeneration poset over F₉</title>
  <desc id="description">6 affine-equivalence classes. Arrows point downward
  from a quadratic map to a class obtainable using possibly singular affine
  input and output processors. Every node displays its equivalence-class size.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; opacity: .74; }
      .node text { fill: #172033; text-anchor: middle;
                    font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .form { font-size: 24px; font-weight: 700; }
      .kind { font-size: 16px; fill: #475569; }
      .size { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .title { fill: #172033; font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #475569; font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="875" fill="#ffffff"/>
  <text class="title" x="600" y="48" text-anchor="middle">
    Quadratic maps F₉² → F₉
  </text>
  <text class="subtitle" x="600" y="78" text-anchor="middle">
    affine-equivalence classes and singular-processor degenerations
  </text>
  <text class="legend" x="600" y="111" text-anchor="middle">
    arrow: resource → implementable degeneration · 531,441 coefficient vectors
  </text>
  <path class="edge" d="M 142 291 C 142 362.5, 337 362.5, 337 434" marker-end="url(#arrow)"/><path class="edge" d="M 238 291 C 238 362.5, 767 362.5, 767 434" marker-end="url(#arrow)"/><path class="edge" d="M 552 291 C 552 362.5, 433 362.5, 433 434" marker-end="url(#arrow)"/><path class="edge" d="M 648 291 C 648 362.5, 815 362.5, 815 434" marker-end="url(#arrow)"/><path class="edge" d="M 1010 291 C 1010 362.5, 863 362.5, 863 434" marker-end="url(#arrow)"/><path class="edge" d="M 385 556 C 385 612.5, 552 612.5, 552 669" marker-end="url(#arrow)"/><path class="edge" d="M 815 556 C 815 612.5, 648 612.5, 648 669" marker-end="url(#arrow)"/>
  <g class="node parabolic" transform="translate(190 235)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² + y</text><text class="kind" x="0" y="8">parabolic</text><text class="size" x="0" y="37">|class| = 51,840</text></g><g class="node split" transform="translate(600 235)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2.5"/><text class="form" x="0" y="-20">xy</text><text class="kind" x="0" y="8">split quadratic</text><text class="size" x="0" y="37">|class| = 262,440</text></g><g class="node anisotropic" transform="translate(1010 235)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#be123c" fill-opacity="0.10" stroke="#be123c" stroke-width="2.5"/><text class="form" x="0" y="-20">x² − νy²</text><text class="kind" x="0" y="8">anisotropic</text><text class="size" x="0" y="37">|class| = 209,952</text></g><g class="node linear" transform="translate(385 500)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2.5"/><text class="form" x="0" y="-20">x</text><text class="kind" x="0" y="8">linear</text><text class="size" x="0" y="37">|class| = 720</text></g><g class="node rank1" transform="translate(815 500)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/><text class="form" x="0" y="-20">x²</text><text class="kind" x="0" y="8">rank-1 quadratic</text><text class="size" x="0" y="37">|class| = 6,480</text></g><g class="node constant" transform="translate(600 735)"><rect x="-128" y="-56" width="256" height="112" rx="18" fill="#64748b" fill-opacity="0.10" stroke="#64748b" stroke-width="2.5"/><text class="form" x="0" y="-20">constant</text><text class="kind" x="0" y="8">constant</text><text class="size" x="0" y="37">|class| = 9</text></g>
</svg>
