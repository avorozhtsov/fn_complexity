  <text class="note" x="479" y="151.31">β = 0, the critical line</text>
  <circle cx="374.731" cy="197.183" r="4.5" fill="#7c3aed"/>
  <text class="mark" x="362.731" y="215.183" text-anchor="end">β = 3</text>
  <circle cx="555.269" cy="197.183" r="4.5" fill="#7c3aed"/>
  <text class="mark" x="567.269" y="215.183" text-anchor="start">β = −3</text>
  <text class="legend" x="840" y="170">Z(β) = ξ(½ + β)</text>
  <text class="legend" x="840" y="196">= ∫ Φ(u) e^{βu} du,  Φ &gt; 0</text>
  <text class="legend" x="840" y="232">Φ even ⟹ Z(β) = Z(−β)</text>
  <text class="legend" x="840" y="258">⟹ E odd, H even</text>
  <text class="legend" x="840" y="294">the mirror symmetry is</text>
  <text class="legend" x="840" y="320">the functional equation</text>
  <text class="legend" x="840" y="346">ξ(s) = ξ(1 − s)</text>
